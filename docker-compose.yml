services:
  postgres:
    image: postgres:16-alpine
    container_name: content-review-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: content_review
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - content-review-db:/var/lib/postgresql/data

volumes:
  content-review-db:
  